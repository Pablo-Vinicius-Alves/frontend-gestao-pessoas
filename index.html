<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pessoas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Gestão de Pessoas</h1>
    <p class="subtitulo">Cadastre uma pessoa.</p>

    <form id="form-pessoa" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100" placeholder="Ex.: Carlos" required>
      </div>

      <div class="campo">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" max="150" placeholder="Ex.: 22" required>
      </div>

      <button type="submit" id="btn-cadastrar">Cadastrar</button>
    </form>

    <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>

    <section class="lista">
      <h2>Pessoas cadastradas</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
          </tr>
        </thead>
        <tbody id="tabela-pessoas">
          <tr><td colspan="3">Carregando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/js/script.js" defer></script>
</body>
</html>
